<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail MCP Agent</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <div class="login-box">
                <h1>📧 Gmail MCP Agent</h1>
                <p class="subtitle">AI-powered email assistant</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p id="login-error" class="error"></p>
                </form>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="screen hidden">
            <header class="header">
                <h1>📧 Gmail MCP Agent</h1>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </header>

            <main class="chat-container">
                <div id="messages" class="messages">
                    <div class="message ai">
                        <div class="message-content">
                            Hello! I'm your Gmail assistant. I can help you:
                            <ul>
                                <li>List and summarize your emails</li>
                                <li>Search for specific emails (e.g., job applications)</li>
                                <li>Draft and send replies</li>
                                <li>Delete spam emails</li>
                            </ul>
                            How can I help you today?
                        </div>
                    </div>
                </div>

                <form id="chat-form" class="chat-input">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="Type your message..." 
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </main>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
